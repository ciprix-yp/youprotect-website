name = "youprotect-website"
pages_build_output_dir = "./dist"
compatibility_date = "2026-02-25"
compatibility_flags = ["nodejs_compat"]

# Inbox-ul cererilor de pe site (functions/api/submit-lead.js, functions/api/crm/leads.js).
# Baza se creează o dată, cu date doar în UE:
#   npx wrangler d1 create youprotect-leads --jurisdiction eu
# apoi id-ul primit se pune mai jos și se aplică schema:
#   npx wrangler d1 migrations apply youprotect-leads --remote
# Fără binding, formularul merge doar prin email (Resend).
# [[d1_databases]]
# binding = "LEADS_DB"
# database_name = "youprotect-leads"
# database_id = "<id din wrangler d1 create>"
# migrations_dir = "migrations"

# Secrete (Cloudflare Pages → Settings → Variables and Secrets, la production și la preview):
#   RESEND_API_KEY   – cheia Resend (aceeași ca în Keychain: secret get youprotect-website RESEND_API_KEY)
#   CRM_SYNC_TOKEN   – token-ul cu care Prospector CRM preia cererile (min. 32 de caractere)
# Opționale: LEAD_NOTIFY_TO (implicit office@youprotect.ro), LEAD_NOTIFY_FROM (implicit noreply@deeplogic.ro).
