# Lunar: verifică linkurile către fișele tehnice și declarațiile din catalog (scripts/catalog/check-documents.mjs) și
# sursele citate în ghiduri și pe paginile de marcă (scripts/seo/check-sources.mjs).
# Pe 19.11.2026, patru declarații Sir Safety de pe site întorceau HTML sau 404; pe 27.11.2026, patru surse MASCOT din
# ghidul despre haine de lucru dădeau 404. Dacă un link se strică, job-ul pică și GitHub trimite notificarea; fișa se
# reface cu scripts/catalog/extract_sirsafety.py --declarations-only, iar sursa se înlocuiește în src/lib/guides.ts.
name: documente-lunar

on:
  schedule:
    - cron: "0 7 2 * *" # pe 2 ale lunii, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Documentele din catalog sunt PDF-uri
        run: node scripts/catalog/check-documents.mjs

      - name: Sursele din ghiduri răspund
        if: ${{ !cancelled() }}
        run: node scripts/seo/check-sources.mjs
