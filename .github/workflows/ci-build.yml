name: CI Build

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (formular, inbox CRM)
        run: npm test

      # TypeScript și componentele Astro: Vite doar șterge tipurile, nu le verifică (audit, 20.11.2026).
      - name: Verificare de tipuri (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Titluri și descrieri (lungime, duplicate)
        run: node scripts/seo/check-meta.mjs dist
