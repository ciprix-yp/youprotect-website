name: CI Build

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (formular, inbox CRM)
        run: npm test

      # TypeScript și componentele Astro: Vite doar șterge tipurile, nu le verifică (audit, 20.11.2026).
      - name: Verificare de tipuri (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      # Pozele în acțiune: regulile (Portwest, max. 2 pagini, erou) pe paginile generate; fără dist/ testul pică.
      # Întrebările frecvente și tabelul de certificări pliate (D-2026-11-27-03) se verifică tot pe dist.
      - name: Poze, întrebări pliate și certificări în dist (reguli pe paginile generate)
        run: node --test tests/poze-actiune.test.mjs tests/scroll-timeline-overflow.test.mjs tests/faq-pliat.test.mjs tests/faq-pliat-margini.test.mjs tests/certificari-compact.test.mjs
        env:
          POZE_REQUIRE_DIST: '1'

      - name: Titluri și descrieri (lungime, duplicate)
        run: node scripts/seo/check-meta.mjs dist

      # Scripturile de pe fiecare pagină rămân în pagină: din fișier separat, Chrome sărea tranziția dintre pagini.
      - name: Scripturi în pagină (tranziții)
        run: node scripts/check-inline-scripts.mjs dist
