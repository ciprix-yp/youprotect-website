[project]
name = "yp-scene-pilot"
version = "0.0.0"
description = "Pipeline local de scene de catalog (mediu separat de package.json și de CI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.15.0",
  "torchvision==0.29.2",
  "diffusers==0.43.0",
  "transformers==5.24.1",
  "safetensors==0.8.0",
  "accelerate==1.16.0",
  "huggingface-hub==2.5.0",
  "numpy==2.5.5",
  "scipy==1.18.1",
  "pillow==13.0.0",
  "opencv-python-headless==5.1.0.95",
  "scikit-image==0.26.0",
  "pymatting==1.1.16",
  "rapidocr==3.10.0",
  "onnxruntime==1.32.0",
  "timm==1.0.31",
  "kornia==0.9.2",
  "einops==0.8.2",
]

[tool.uv]
package = false
# Cooldown de 7 zile pentru orice pachet nou (regula Semgrep). Excepție explicită, cu limită fixă la data citirii surselor (2026-11-27):
# transformers 5.24.1 și huggingface-hub 2.5.0, fixate exact pe baza matricei din PROJECT_OS/10-SCENE-PRODUS.md, sunt mai noi de 7 zile.
exclude-newer = "7 days"
exclude-newer-package = { transformers = "2026-11-27T00:00:00Z", huggingface-hub = "2026-11-27T00:00:00Z" }
